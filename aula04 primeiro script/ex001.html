<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(91, 162, 224);
            color: white;
            font: normal 20pt Arial;
        }

        h1 {
            color: rgb(194, 191, 191);

</head>

<body>

    </script>
</body>

</html>
