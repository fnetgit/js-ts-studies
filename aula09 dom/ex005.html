<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body {
            background-color: rgb(68, 125, 199);
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>

<body>
    <h1>iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript.</p>
    <div>Clique em mim</div>
    <script>
        var p1 = window.document.getElementsByTagName('p')[1] /*colchete representa os parágrafos, iniciando de 0  */
        window.document.write('Está escrito assim: ' + p1.innerText) /* pega o conteúdo de outro parágrafo */
        /* innerText pega o texto sem as filhas(sem formatação)
        innerHTMl pega tudo */
        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName('p')[1]
        p1.style.color = 'blue'
        corpo.style.background = 'black'
        p1.style.color = 'blue'

        /*document.write(p1.innerHTML)*/

    </script>
</body>

</html>
<!-- DOM(Document Object Model) Modelo de Documento por Objetos 
    depois ver melhor árvore DOM-->
