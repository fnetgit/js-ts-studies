<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(91, 162, 224);
            color: white; /*comentário em css*/
            font: normal 20pt Arial;
        }
        h1 { 
            color: rgb(194, 191, 191);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1> <!--comentamos assim em html-->
    <p>Já me livrei da maldição</p>
    <script>
    var n1 = Number(window.prompt('Digite um número: '))
    var n2 = Number(window.prompt('Digite outro número: '))
    var s = n1 + n2
    //window.alert('A soma dos números é: ' + s)
    window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
    // (number + number) para adição;
    // (string + string) para concatenação;
    // o window.prompt volta como uma string;
    // parseInt: converter para inteiro;
    // parseFloat: converter para real;
    // hoje em dia pode só usar Number que ele se vira, esses dois são só para especificar;
    // comentário fácil Shift + Alt + A
    </script>
</body>
</html>
