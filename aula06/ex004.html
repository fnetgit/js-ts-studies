<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex004</title>
    <style>
        body {
            font: normal 20pt Arial;
        }
    </style>
</head>

<body>

    <script>
        //x.length quantas letras a string tem
        //x.toUpperCase() tudo para maiúsculas
        //x.toLowerCase() tudo para minúsculas
        var nome = window.prompt('Qual é o seu nome?')
        document.write(`Olá, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras.<br/>`)
        document.write(`Seu nome em maiúsculas é ${nome.toUpperCase()}<br/>`)
        document.write(`Seu nome em minúsculas é ${nome.toLowerCase()}`)
    </script>
</body>
<!-- para alinhar é Shift + Alt + F -->
<!-- x.toFixed(um número) converter para mudar a casa de uma coisa -->
<!-- x.replace('uma coisa', 'outra') trocar elementos -->
</html>
