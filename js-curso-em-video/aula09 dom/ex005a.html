<!DOCTYPE html>
<html lang="pt-br">
<!-- selecionamos elementos no DOM por: marca, id, nome, classe, seletor -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body {
            background-color: rgb(68, 125, 199);
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>

<body>
    <h1>iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript.</p>
    <div id="msg">Clique em mim</div>
    <script>
        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName('p')[1]
        var d = document.getElementById('msg')
        d.style.background = 'green'
        d.innerText = 'Estou aguardando...'
        //document.getElementById('msg').innerText = 'Estou aguardando...'  assim eu modifico da mesma maneira, porém fica bem maior//

    </script>
</body>

</html>
<!-- DOM(Document Object Model) Modelo de Documento por Objetos -->
<!-- quando é id usa #, quando é classe . -->
